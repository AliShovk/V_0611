<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- сетка -->
  <g stroke="#C9C2B2" stroke-width="2" opacity="0.7">
    <line x1="80" y1="160" x2="560" y2="160"/>
    <line x1="80" y1="260" x2="560" y2="260"/>
    <line x1="80" y1="360" x2="560" y2="360"/>
  </g>
  <!-- база -->
  <line x1="80" y1="460" x2="560" y2="460" stroke="#26305C" stroke-width="5" stroke-linecap="round"/>
  <!-- газобетон: 400 -->
  <rect x="130" y="340" width="120" height="120" rx="8" fill="#C6D7F0" stroke="#26305C" stroke-width="4"/>
  <text x="190" y="318" font-family="DejaVu Sans, sans-serif" font-size="54" font-weight="bold"
        fill="#26305C" text-anchor="middle">400</text>
  <text x="190" y="512" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#26305C"
        text-anchor="middle">газобетон</text>
  <!-- кирпич: 1600 -->
  <rect x="350" y="220" width="120" height="240" rx="8" fill="#26305C"/>
  <text x="410" y="198" font-family="DejaVu Sans, sans-serif" font-size="54" font-weight="bold"
        fill="#26305C" text-anchor="middle">1600</text>
  <text x="410" y="512" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#26305C"
        text-anchor="middle">кирпич</text>
  <text x="80" y="120" font-family="DejaVu Sans, sans-serif" font-size="26" fill="#8A90A0">кг/м³</text>
</svg>
