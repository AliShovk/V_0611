<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!-- фрагмент стены слева -->
  <g fill="#E9E2D3" stroke="#26305C" stroke-width="4">
    <rect x="-40" y="120" width="150" height="86" rx="6"/>
    <rect x="-40" y="212" width="150" height="86" rx="6"/>
    <rect x="-40" y="304" width="150" height="86" rx="6"/>
    <rect x="-40" y="396" width="150" height="86" rx="6"/>
  </g>
  <!-- вырванный крепёж -->
  <g stroke="#26305C" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 120 300 C 150 300 160 310 168 318"/>
  </g>
  <!-- падающая полка с телевизором -->
  <g transform="rotate(16 340 360)">
    <rect x="170" y="330" width="340" height="18" rx="4" fill="#26305C"/>
    <rect x="200" y="220" width="280" height="112" rx="10" fill="#F4EFE4" stroke="#26305C" stroke-width="5"/>
    <rect x="216" y="236" width="248" height="80" rx="6" fill="#C6D7F0"/>
    <circle cx="340" cy="326" r="4" fill="#26305C"/>
  </g>
  <!-- линии движения и пыль -->
  <g stroke="#8A90A0" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 150 250 C 180 232 210 226 238 226"/>
    <path d="M 150 285 C 184 272 214 268 244 268"/>
  </g>
  <g stroke="#B9AF9C" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M 300 470 A 40 40 0 0 1 360 470"/>
    <path d="M 250 470 A 55 55 0 0 1 400 470"/>
