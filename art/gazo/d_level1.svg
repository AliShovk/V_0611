    </g>
  </g>

  <!-- уровень -->
  <g>
    <rect x="90" y="190" width="420" height="54" rx="12" fill="url(#alu)" stroke="#7C879D" stroke-width="3"/>
    <rect x="236" y="203" width="128" height="28" rx="9" fill="url(#glass)" stroke="#8ED7E4" stroke-width="2"/>
    <line x1="300" y1="203" x2="300" y2="231" stroke="#1B2234" stroke-width="2" opacity="0.45"/>
    <line x1="286" y1="203" x2="286" y2="231" stroke="#FFFFFF" stroke-width="2" opacity="0.65"/>
    <line x1="314" y1="203" x2="314" y2="231" stroke="#FFFFFF" stroke-width="2" opacity="0.65"/>
    <ellipse cx="300" cy="217" rx="20" ry="9" fill="#EAF9FC" stroke="#FFFFFF" stroke-width="2"/>
