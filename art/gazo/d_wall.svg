    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F5FA"/>
      <stop offset="0.45" stop-color="#B9C2D4"/>
      <stop offset="1" stop-color="#7A8398"/>
    </linearGradient>
    </defs>

  <g>
