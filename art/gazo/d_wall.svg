    <circle cx="330" cy="145" r="3"/><circle cx="440" cy="175" r="4"/><circle cx="520" cy="150" r="3"/>
    <circle cx="60" cy="250" r="3"/><circle cx="180" cy="270" r="4"/><circle cx="300" cy="245" r="3"/>
