<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="blk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39445F"/>
      <stop offset="1" stop-color="#242C42"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4E5E"/>
      <stop offset="1" stop-color="#0E2733"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5878"/>
      <stop offset="1" stop-color="#2A3348"/>
    </linearGradient>
    </defs>

  <!-- стена слева -->
  <g>
    <g fill="url(#blk)" stroke="#4C5878" stroke-width="3">
      <rect x="8" y="130" width="128" height="88" rx="10"/>
      <rect x="8" y="226" width="128" height="88" rx="10"/>
      <rect x="8" y="322" width="128" height="88" rx="10"/>
      <rect x="8" y="418" width="128" height="88" rx="10"/>
    </g>
  </g>

  <!-- вырванный кусок -->
  <g>
    <path d="M 108 300 L 150 286 L 158 320 L 118 334 Z" fill="#4E5C7C" stroke="#6B7AA0" stroke-width="3"/>
  </g>

  <!-- падающая полка -->
  <g transform="rotate(15 320 360)">
    <rect x="150" y="336" width="360" height="20" rx="6" fill="url(#slab)" stroke="#5A688C" stroke-width="2"/>
    <rect x="186" y="212" width="290" height="118" rx="12" fill="#0F1524" stroke="#5A688C" stroke-width="4"/>
    <rect x="202" y="228" width="258" height="86" rx="8" fill="url(#screen)"/>
    <circle cx="331" cy="330" r="4" fill="#7C879D"/>
  </g>

  <!-- линии движения -->
  <g stroke="#7C879D" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M 130 250 C 168 234 200 228 232 228"/>
    <path d="M 130 292 C 172 278 204 274 236 274"/>
  </g>

  <!-- пыль -->
  <g stroke="#3C4763" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 260 500 A 60 60 0 0 1 380 500"/>
    <path d="M 220 512 A 84 84 0 0 1 420 512"/>
  </g>
</svg>
