    <line x1="300" y1="365" x2="300" y2="393" stroke="#1B2234" stroke-width="2" opacity="0.5"/>
  </g>
  <circle cx="500" cy="379" r="26" fill="#3A1212" stroke="#FF5B4A" stroke-width="4"/>
  <line x1="489" y1="368" x2="511" y2="390" stroke="#FF5B4A" stroke-width="6" stroke-linecap="round"/>
  <line x1="511" y1="368" x2="489" y2="390" stroke="#FF5B4A" stroke-width="6" stroke-linecap="round"/>

  <text x="60" y="130" font-family="DejaVu Sans" font-size="26" fill="#9AA6BF">как приложил</text>
