    <rect x="60" y="352" width="480" height="54" rx="10" fill="url(#alu)" stroke="#7C879D" stroke-width="3"/>
    <rect x="236" y="365" width="128" height="28" rx="8" fill="url(#glass)" stroke="#8ED7E4" stroke-width="2"/>
