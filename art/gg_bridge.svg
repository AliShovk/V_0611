<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2603f"/>
      <stop offset="0.45" stop-color="#c0362c"/>
      <stop offset="1" stop-color="#7d1f18"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e2a24"/>
      <stop offset="1" stop-color="#2b1310"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2233" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0f18" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- лёгкая дымка под мостом -->
  <rect x="0" y="470" width="1400" height="160" fill="url(#sky)"/>

