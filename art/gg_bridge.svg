    <rect x="336" y="150" width="76" height="14" fill="#a72c22" stroke="#4a1410" stroke-width="2"/>
    <rect x="342" y="118" width="64" height="12" fill="#a72c22" stroke="#4a1410" stroke-width="2"/>
    <rect x="348" y="100" width="52" height="10" fill="#a72c22" stroke="#4a1410" stroke-width="2"/>
    <g stroke="#7d1f18" stroke-width="2" opacity="0.8">
      <path d="M360 210 L360 460"/><path d="M370 210 L370 460"/><path d="M380 210 L380 460"/>
    </g>
    <!-- правая -->
    <path d="M1012 92 L1048 92 L1056 470 L1004 470 Z" fill="url(#or)" stroke="#4a1410" stroke-width="3"/>
    <path d="M1022 92 L1038 92 L1042 200 L1018 200 Z" fill="#e2603f" opacity="0.55"/>
    <g stroke="#4a1410" stroke-width="3">
      <path d="M1004 200 L1056 200"/><path d="M1006 300 L1054 300"/><path d="M1008 400 L1052 400"/>
      <path d="M1006 200 L1054 300"/><path d="M1054 200 L1006 300"/>
      <path d="M1008 300 L1052 400"/><path d="M1052 300 L1008 400"/>
    </g>
    <rect x="996" y="150" width="76" height="14" fill="#a72c22" stroke="#4a1410" stroke-width="2"/>
    <rect x="1002" y="118" width="64" height="12" fill="#a72c22" stroke="#4a1410" stroke-width="2"/>
    <rect x="1008" y="100" width="52" height="10" fill="#a72c22" stroke="#4a1410" stroke-width="2"/>
    <g stroke="#7d1f18" stroke-width="2" opacity="0.8">
      <path d="M1020 210 L1020 460"/><path d="M1030 210 L1030 460"/><path d="M1040 210 L1040 460"/>
    </g>
    <!-- огни -->
    <circle cx="370" cy="86" r="6" fill="#ff6a5a"/>
    <circle cx="1030" cy="86" r="6" fill="#ff6a5a"/>
  </g>

  <!-- анкеры -->
  <g fill="#4a4a48" stroke="#20201e" stroke-width="3">
    <rect x="10" y="452" width="44" height="90"/>
    <rect x="1346" y="452" width="44" height="90"/>
  </g>
</svg>
