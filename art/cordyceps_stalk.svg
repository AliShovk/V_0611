<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="440" viewBox="0 0 180 440">
  <defs>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#f3e3bd"/>
      <stop offset="0.28" stop-color="#e3c896"/>
      <stop offset="0.72" stop-color="#c39c62"/>
      <stop offset="1" stop-color="#8a6234"/>
    </linearGradient>
    <linearGradient id="club" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fbeecb"/>
      <stop offset="0.4" stop-color="#e6cb96"/>
      <stop offset="1" stop-color="#a97c49"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur6" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <ellipse cx="92" cy="200" rx="80" ry="200" fill="url(#halo)"/>

  <!-- стебель: изогнутый, с утолщением у основания -->
  <path d="M74 432 C 62 380, 58 330, 64 288 C 70 246, 82 214, 88 180 C 94 146, 92 118, 88 96
           L112 92 C 118 118, 120 148, 116 182 C 112 218, 102 250, 96 290
           C 90 332, 92 382, 104 432 Z"
        fill="url(#stem)" stroke="#7d5730" stroke-width="2.4"/>
  <!-- продольные волокна -->
  <g stroke="#a87e48" stroke-width="1.5" opacity="0.55" fill="none">
    <path d="M80 404 C 70 360, 68 318, 74 276 C 80 236, 90 206, 94 174"/>
    <path d="M92 410 C 84 366, 82 322, 88 280 C 94 240, 102 208, 106 176"/>
    <path d="M100 418 C 94 374, 94 330, 100 292"/>
  </g>
  <!-- поперечные колечки -->
  <g stroke="#c9a26c" stroke-width="1.4" opacity="0.45" fill="none">
    <path d="M70 350 C 82 346, 96 346, 104 350"/>
    <path d="M66 300 C 78 296, 92 296, 100 300"/>
    <path d="M72 250 C 84 246, 98 246, 106 250"/>
    <path d="M80 200 C 92 196, 104 196, 112 200"/>
    <path d="M86 150 C 96 146, 108 146, 116 150"/>
  </g>
  <!-- основание: тёмное утолщение -->
  <path d="M66 432 C 64 416, 70 404, 88 402 C 104 402, 112 414, 110 432 Z"
        fill="#8a6234" opacity="0.75"/>

  <!-- плодовое тело (строма) -->
  <path d="M88 98 C 72 82, 66 56, 78 34 C 92 8, 124 6, 136 26 C 148 46, 138 76, 118 94 Z"
        fill="url(#club)" stroke="#7d5730" stroke-width="2.4"/>
  <!-- объём: тень справа снизу -->
  <path d="M118 94 C 134 74, 142 50, 132 30 C 128 44, 118 70, 104 88 Z"
        fill="#a97c49" opacity="0.35"/>
  <!-- перитеции с ободками -->
  <g>
    <g fill="#8a6234" opacity="0.9">
      <circle cx="92" cy="44" r="4.2"/><circle cx="104" cy="30" r="4"/><circle cx="118" cy="28" r="4"/>
      <circle cx="128" cy="40" r="4.2"/><circle cx="130" cy="56" r="4"/><circle cx="120" cy="68" r="4"/>
      <circle cx="106" cy="72" r="4.2"/><circle cx="94" cy="64" r="4"/><circle cx="86" cy="54" r="3.8"/>
    </g>
    <g fill="#5f3f1e" opacity="0.75">
      <circle cx="92" cy="44" r="1.8"/><circle cx="104" cy="30" r="1.7"/><circle cx="118" cy="28" r="1.7"/>
      <circle cx="128" cy="40" r="1.8"/><circle cx="130" cy="56" r="1.7"/><circle cx="120" cy="68" r="1.7"/>
      <circle cx="106" cy="72" r="1.8"/><circle cx="94" cy="64" r="1.7"/>
    </g>
  </g>
  <!-- блик света -->
  <path d="M86 40 C 96 20, 118 16, 130 26" fill="none" stroke="#fff6dd" stroke-width="3"
        opacity="0.7" stroke-linecap="round"/>
</svg>
