<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a97ad"/>
      <stop offset="0.22" stop-color="#5d6b82"/>
      <stop offset="0.55" stop-color="#3d4a5e"/>
      <stop offset="1" stop-color="#222b39"/>
    </linearGradient>
    <linearGradient id="steel2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a7b4c8"/>
      <stop offset="0.5" stop-color="#6d7c93"/>
      <stop offset="1" stop-color="#2f3949"/>
    </linearGradient>
    <linearGradient id="cutter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8d3e4"/>
      <stop offset="0.45" stop-color="#7d8899"/>
      <stop offset="1" stop-color="#39424f"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0a848"/>
      <stop offset="1" stop-color="#a8631f"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d9e2f0"/>
      <stop offset="1" stop-color="#556072"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- тень под машиной -->
  <ellipse cx="520" cy="410" rx="420" ry="26" fill="#000" opacity="0.35" filter="url(#soft)"/>

  <!-- хвостовые рамы (gantry) -->
  <g>
    <rect x="690" y="120" width="18" height="250" fill="url(#steel2)" stroke="#1b2230"/>
    <rect x="820" y="120" width="18" height="250" fill="url(#steel2)" stroke="#1b2230"/>
    <rect x="690" y="120" width="148" height="16" fill="url(#steel)" stroke="#1b2230"/>
    <rect x="905" y="150" width="14" height="220" fill="url(#steel2)" stroke="#1b2230"/>
    <!-- конвейер -->
    <rect x="700" y="300" width="230" height="26" rx="6" fill="#2a3342" stroke="#5b6a80"/>
    <g stroke="#8fa0b8" stroke-width="2" opacity="0.8">
      <path d="M712 313 L860 313"/>
      <path d="M712 306 L858 306" opacity="0.5"/>
    </g>
    <g fill="#4b5666">
      <circle cx="708" cy="330" r="10" stroke="#8fa0b8" stroke-width="2"/>
      <circle cx="850" cy="330" r="10" stroke="#8fa0b8" stroke-width="2"/>
      <circle cx="922" cy="330" r="10" stroke="#8fa0b8" stroke-width="2"/>
    </g>
    <!-- трубы и кабели -->
    <path d="M690 200 C 760 192, 830 208, 920 200" stroke="#7f8ea4" stroke-width="7" fill="none"/>
    <path d="M690 224 C 760 216, 830 232, 920 224" stroke="#c98a4a" stroke-width="5" fill="none"/>
    <path d="M690 246 C 760 240, 830 252, 920 246" stroke="#5f7fa0" stroke-width="4" fill="none"/>
  </g>

  <!-- корпус щита -->
  <g>
    <rect x="250" y="70" width="470" height="300" rx="26" fill="url(#steel)" stroke="#151b26" stroke-width="3"/>
    <!-- рёбра -->
    <g fill="url(#steel2)" stroke="#1b2230" stroke-width="2">
      <rect x="300" y="76" width="16" height="288" rx="3"/>
      <rect x="380" y="76" width="16" height="288" rx="3"/>
      <rect x="460" y="76" width="16" height="288" rx="3"/>
      <rect x="540" y="76" width="16" height="288" rx="3"/>
      <rect x="620" y="76" width="16" height="288" rx="3"/>
    </g>
    <!-- верхний блик -->
    <rect x="256" y="78" width="456" height="18" rx="9" fill="#b9c6d8" opacity="0.35"/>
    <!-- болты -->
    <g fill="#8d9aae" stroke="#1b2230">
      <circle cx="320" cy="92" r="5"/><circle cx="400" cy="92" r="5"/>
      <circle cx="480" cy="92" r="5"/><circle cx="560" cy="92" r="5"/>
      <circle cx="640" cy="92" r="5"/><circle cx="700" cy="92" r="5"/>
      <circle cx="320" cy="350" r="5"/><circle cx="400" cy="350" r="5"/>
      <circle cx="480" cy="350" r="5"/><circle cx="560" cy="350" r="5"/>
      <circle cx="640" cy="350" r="5"/><circle cx="700" cy="350" r="5"/>
    </g>
    <!-- гидроцилиндры -->
    <g>
      <rect x="718" y="150" width="70" height="26" rx="8" fill="#3a4657" stroke="#8b9ab0" stroke-width="2"/>
      <rect x="786" y="157" width="52" height="12" rx="6" fill="#c7d2e2" stroke="#6d7b8f"/>
      <rect x="718" y="196" width="70" height="26" rx="8" fill="#3a4657" stroke="#8b9ab0" stroke-width="2"/>
      <rect x="786" y="203" width="52" height="12" rx="6" fill="#c7d2e2" stroke="#6d7b8f"/>
      <rect x="718" y="242" width="70" height="26" rx="8" fill="#3a4657" stroke="#8b9ab0" stroke-width="2"/>
      <rect x="786" y="249" width="52" height="12" rx="6" fill="#c7d2e2" stroke="#6d7b8f"/>
      <rect x="718" y="288" width="70" height="26" rx="8" fill="#3a4657" stroke="#8b9ab0" stroke-width="2"/>
      <rect x="786" y="295" width="52" height="12" rx="6" fill="#c7d2e2" stroke="#6d7b8f"/>
    </g>
  </g>

  <!-- ротор -->
  <g>
    <circle cx="250" cy="220" r="196" fill="url(#cutter)" stroke="#141a24" stroke-width="4"/>
    <circle cx="250" cy="220" r="176" fill="none" stroke="#aebbd0" stroke-width="2" opacity="0.5"/>
    <!-- прорези -->
    <g fill="#1b2230" opacity="0.85">
      <path d="M250 40 A 180 180 0 0 1 400 130 L 330 170 A 100 100 0 0 0 250 120 Z"/>
      <path d="M420 200 A 180 180 0 0 1 390 330 L 310 300 A 100 100 0 0 0 330 220 Z"/>
      <path d="M180 390 A 180 180 0 0 1 60 300 L 140 270 A 100 100 0 0 0 200 330 Z"/>
      <path d="M60 160 A 180 180 0 0 1 190 50 L 210 130 A 100 100 0 0 0 130 190 Z"/>
    </g>
    <!-- спицы -->
    <g stroke="#9aa8bd" stroke-width="10" opacity="0.85" stroke-linecap="round">
      <path d="M250 220 L 250 60"/>
      <path d="M250 220 L 390 150"/>
      <path d="M250 220 L 390 300"/>
      <path d="M250 220 L 250 380"/>
      <path d="M250 220 L 110 300"/>
      <path d="M250 220 L 110 150"/>
    </g>
    <!-- дисковые резцы по ободу -->
    <g>
      <g fill="#d7e0ee" stroke="#39424f" stroke-width="2">
        <circle cx="250" cy="30" r="11"/><circle cx="330" cy="44" r="11"/><circle cx="396" cy="92" r="11"/>
        <circle cx="432" cy="160" r="11"/><circle cx="432" cy="240" r="11"/><circle cx="404" cy="314" r="11"/>
        <circle cx="350" cy="372" r="11"/><circle cx="276" cy="404" r="11"/><circle cx="190" cy="400" r="11"/>
        <circle cx="120" cy="360" r="11"/><circle cx="76" cy="298" r="11"/><circle cx="58" cy="220" r="11"/>
        <circle cx="78" cy="140" r="11"/><circle cx="124" cy="76" r="11"/><circle cx="190" cy="36" r="11"/>
      </g>
      <g fill="#8f9bb0" opacity="0.9">
        <circle cx="250" cy="30" r="4"/><circle cx="396" cy="92" r="4"/><circle cx="432" cy="240" r="4"/>
        <circle cx="350" cy="372" r="4"/><circle cx="190" cy="400" r="4"/><circle cx="76" cy="298" r="4"/>
        <circle cx="78" cy="140" r="4"/>
      </g>
    </g>
    <!-- ступица -->
    <circle cx="250" cy="220" r="46" fill="url(#hub)" stroke="#2a3342" stroke-width="3"/>
    <circle cx="250" cy="220" r="18" fill="#2a3342"/>
    <g stroke="#8e9db4" stroke-width="3">
      <path d="M232 220 L 268 220"/><path d="M250 202 L 250 238"/>
    </g>
  </g>

  <!-- прожекторы -->
  <g>
    <rect x="560" y="52" width="46" height="16" rx="6" fill="#3c4757" stroke="#8b9ab0"/>
    <circle cx="572" cy="60" r="6" fill="#ffe9a8"/>
    <circle cx="596" cy="60" r="6" fill="#ffe9a8"/>
    <rect x="300" y="52" width="46" height="16" rx="6" fill="#3c4757" stroke="#8b9ab0"/>
    <circle cx="312" cy="60" r="6" fill="#ffe9a8"/>
    <circle cx="336" cy="60" r="6" fill="#ffe9a8"/>
  </g>

</svg>
