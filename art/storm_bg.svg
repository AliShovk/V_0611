<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="0.28" stop-color="#182a52"/>
      <stop offset="0.52" stop-color="#3b3f6b"/>
      <stop offset="0.72" stop-color="#6b5375"/>
      <stop offset="0.86" stop-color="#a4696a"/>
      <stop offset="1" stop-color="#c98a63"/>
    </linearGradient>
    <linearGradient id="cloudDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3560"/>
      <stop offset="0.5" stop-color="#1e2748"/>
      <stop offset="1" stop-color="#141b34"/>
    </linearGradient>
    <linearGradient id="cloudLit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d7fa8"/>
      <stop offset="0.6" stop-color="#4a4f76"/>
      <stop offset="1" stop-color="#2a3252"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2438"/>
      <stop offset="1" stop-color="#171322"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12101c"/>
      <stop offset="1" stop-color="#07060c"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb37a" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#ffb37a" stop-opacity="0"/>
    </radialGradient>
    <filter id="cb" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="cb2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="720" height="1280" fill="url(#sky)"/>
  <ellipse cx="360" cy="1015" rx="420" ry="180" fill="url(#horizonGlow)"/>

  <!-- дальние облака -->
  <g filter="url(#cb2)" opacity="0.75">
    <ellipse cx="180" cy="370" rx="210" ry="70" fill="#3a4470"/>
    <ellipse cx="520" cy="330" rx="230" ry="76" fill="#333d66"/>
    <ellipse cx="360" cy="470" rx="260" ry="66" fill="#2b3457"/>
  </g>

  <!-- средний ярус облаков -->
  <g filter="url(#cb)" opacity="0.95">
    <ellipse cx="130" cy="560" rx="180" ry="62" fill="#434b78"/>
    <ellipse cx="600" cy="600" rx="190" ry="58" fill="#3b446d"/>
    <ellipse cx="380" cy="660" rx="240" ry="54" fill="#333c62"/>
  </g>

  <!-- тяжёлая туча сверху -->
  <g>
    <path d="M-40 250 C 40 190, 150 200, 210 236 C 270 200, 380 196, 440 232
             C 510 196, 620 206, 700 244 C 760 270, 770 330, 740 360
             C 640 340, 560 372, 470 356 C 380 340, 300 370, 210 352
             C 120 334, 40 356, -40 340 Z"
          fill="url(#cloudDark)"/>
    <path d="M-40 250 C 40 190, 150 200, 210 236 C 270 200, 380 196, 440 232
             C 510 196, 620 206, 700 244"
          fill="none" stroke="#5a6394" stroke-width="3" opacity="0.35"/>
    <!-- подсвеченный край -->
    <path d="M-40 340 C 60 356, 140 334, 210 352 C 300 370, 380 340, 470 356"
          fill="none" stroke="#4e4a72" stroke-width="5" opacity="0.5"/>
    <!-- внутренняя фактура -->
    <g fill="#3a4472" opacity="0.45">
      <ellipse cx="120" cy="300" rx="90" ry="40"/>
      <ellipse cx="300" cy="286" rx="120" ry="46"/>
      <ellipse cx="500" cy="296" rx="110" ry="42"/>
      <ellipse cx="640" cy="310" rx="80" ry="36"/>
    </g>
  </g>

  <!-- дождь -->
  <g stroke="#8ea6d8" stroke-width="2" opacity="0.22" stroke-linecap="round">
    <path d="M60 380 L48 470"/><path d="M140 400 L128 500"/><path d="M230 380 L218 470"/>
    <path d="M320 410 L308 520"/><path d="M410 390 L398 490"/><path d="M500 420 L488 530"/>
    <path d="M590 400 L578 500"/><path d="M670 380 L658 480"/>
    <path d="M100 520 L88 610"/><path d="M280 540 L268 640"/><path d="M450 530 L438 630"/>
    <path d="M620 550 L608 650"/>
  </g>

  <!-- холмы -->
  <path d="M0 940 C 90 900, 170 916, 250 944 C 330 972, 420 950, 500 928
           C 580 906, 660 918, 720 936 L720 1010 L0 1010 Z"
        fill="url(#hill)" opacity="0.95"/>
  <path d="M0 972 C 110 946, 210 966, 300 986 C 390 1006, 500 990, 600 970
           C 660 958, 700 962, 720 968 L720 1024 L0 1024 Z"
        fill="#141122" opacity="0.9"/>

  <!-- земля -->
  <rect x="0" y="1000" width="720" height="280" fill="url(#ground)"/>
  <!-- силуэты деревьев и домов -->
  <g fill="#0a0812">
    <path d="M70 1000 L70 906 L86 890 L102 906 L102 1000 Z"/>
    <path d="M60 912 L86 858 L112 912 Z"/>
    <path d="M120 1000 L120 922 L132 908 L144 922 L144 1000 Z"/>
    <path d="M116 926 L132 884 L148 926 Z"/>
    <rect x="196" y="936" width="76" height="64"/>
    <path d="M190 936 L234 900 L278 936 Z"/>
    <rect x="212" y="958" width="18" height="20" fill="#d8a45c" opacity="0.85"/>
    <rect x="244" y="958" width="16" height="20" fill="#d8a45c" opacity="0.7"/>
    <rect x="330" y="948" width="90" height="52"/>
    <path d="M322 948 L375 906 L428 948 Z"/>
    <rect x="350" y="966" width="16" height="18" fill="#e8b268" opacity="0.8"/>
    <rect x="382" y="966" width="16" height="18" fill="#e8b268" opacity="0.6"/>
    <path d="M470 1000 L470 918 L486 900 L502 918 L502 1000 Z"/>
    <path d="M458 924 L486 866 L514 924 Z"/>
    <path d="M560 1000 L560 930 L572 916 L584 930 L584 1000 Z"/>
    <path d="M556 934 L572 892 L588 934 Z"/>
    <path d="M630 1000 L630 940 L642 926 L654 940 L654 1000 Z"/>
    <path d="M626 944 L642 902 L658 944 Z"/>
  </g>
  <!-- мокрый асфальт с отражениями -->
  <rect x="0" y="1064" width="720" height="216" fill="#0c0a14"/>
  <g opacity="0.22">
    <rect x="212" y="1070" width="10" height="120" fill="#e8b268"/>
    <rect x="352" y="1070" width="10" height="130" fill="#e8b268"/>
    <rect x="390" y="1070" width="8" height="100" fill="#e8b268"/>
  </g>
</svg>
