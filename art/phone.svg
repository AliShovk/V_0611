<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1180" viewBox="0 0 620 1180">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f7c8f"/>
      <stop offset="0.35" stop-color="#2b3442"/>
      <stop offset="0.7" stop-color="#151b25"/>
      <stop offset="1" stop-color="#3d4757"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0b2438"/>
      <stop offset="0.45" stop-color="#07131f"/>
      <stop offset="1" stop-color="#040a12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38d9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0a7fa8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- корпус -->
  <rect x="18" y="18" width="584" height="1144" rx="86" fill="url(#frame)" stroke="#0a0f16" stroke-width="4"/>
  <rect x="28" y="28" width="564" height="1124" rx="78" fill="#0c1219"/>
  <!-- экран -->
  <rect x="46" y="46" width="528" height="1088" rx="64" fill="url(#screen)"/>

  <!-- обои: градиентное свечение -->
  <rect x="46" y="46" width="528" height="1088" rx="64" fill="url(#glow)" opacity="0.55"/>
  <circle cx="310" cy="560" r="230" fill="#0d4f6e" opacity="0.35" filter="url(#soft)"/>

  <!-- блик по стеклу -->
  <path d="M46 300 L 200 46 L 360 46 L 46 470 Z" fill="url(#sheen)"/>

  <!-- вырез камеры -->
  <rect x="248" y="66" width="124" height="30" rx="15" fill="#05090e"/>
  <circle cx="352" cy="81" r="7" fill="#132433"/>
  <circle cx="352" cy="81" r="3" fill="#2f6a8c"/>

  <!-- иконки на экране -->
  <g opacity="0.85">
    <rect x="96" y="150" width="86" height="86" rx="22" fill="#1b3d55" stroke="#2f6a8c" stroke-width="2"/>
    <rect x="206" y="150" width="86" height="86" rx="22" fill="#2a2540" stroke="#5b4b86" stroke-width="2"/>
    <rect x="316" y="150" width="86" height="86" rx="22" fill="#123b34" stroke="#2b7a66" stroke-width="2"/>
    <rect x="426" y="150" width="86" height="86" rx="22" fill="#3d2a20" stroke="#8a5a3a" stroke-width="2"/>
    <rect x="96" y="256" width="86" height="86" rx="22" fill="#20303f" stroke="#3f5b73" stroke-width="2"/>
    <rect x="206" y="256" width="86" height="86" rx="22" fill="#33202a" stroke="#7a3a54" stroke-width="2"/>
    <rect x="316" y="256" width="86" height="86" rx="22" fill="#1d2a45" stroke="#3f5b9c" stroke-width="2"/>
    <rect x="426" y="256" width="86" height="86" rx="22" fill="#22331f" stroke="#4d7a3a" stroke-width="2"/>
  </g>

  <!-- нижний док -->
  <rect x="86" y="980" width="448" height="110" rx="40" fill="#0b1a26" opacity="0.75"/>
  <g fill="#2f5f7d">
    <circle cx="170" cy="1035" r="22"/><circle cx="250" cy="1035" r="22"/>
    <circle cx="330" cy="1035" r="22"/><circle cx="410" cy="1035" r="22"/>
  </g>

  <!-- кнопки -->
  <rect x="602" y="300" width="8" height="90" rx="4" fill="#39424f"/>
  <rect x="10" y="260" width="8" height="54" rx="4" fill="#39424f"/>
  <rect x="10" y="330" width="8" height="90" rx="4" fill="#39424f"/>

  <!-- внутренняя тень рамки -->
  <rect x="46" y="46" width="528" height="1088" rx="64" fill="none" stroke="#000" stroke-opacity="0.6" stroke-width="6"/>
</svg>
