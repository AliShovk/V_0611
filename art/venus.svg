      <path d="M30 352 C 150 384, 290 366, 410 392 C 510 414, 570 404, 620 418 L620 438 C 560 424, 500 436, 410 414 C 290 388, 150 406, 30 376 Z"
            fill="#fff2ce"/>
      <path d="M20 452 C 140 486, 300 466, 420 492 C 520 512, 580 502, 620 516 L620 534 C 570 522, 510 532, 420 512 C 300 486, 150 504, 20 472 Z"
            fill="#b8823f"/>
    </g>
    <!-- вихри -->
    <g fill="none" stroke="#fff6d8" stroke-width="7" opacity="0.30" stroke-linecap="round">
      <path d="M60 236 C 160 258, 280 246, 372 268 C 440 284, 500 280, 548 292"/>
      <path d="M40 410 C 140 430, 250 412, 350 434 C 430 452, 500 446, 560 458"/>
