    <ellipse cx="300" cy="510" rx="160" ry="48" fill="#c2904f" opacity="0.30" filter="url(#soft)"/>
    <!-- тень терминатора -->
    <path d="M300 50 C 430 90, 520 190, 520 300 C 520 410, 430 510, 300 550 C 250 550, 250 50, 300 50 Z"
          fill="#2a1a0c" opacity="0.18"/>
  </g>

  <!-- блик -->
  <ellipse cx="196" cy="176" rx="86" ry="56" fill="#fff8e6" opacity="0.22" transform="rotate(-28 196 176)" filter="url(#soft)"/>
  <circle cx="300" cy="300" r="250" fill="none" stroke="#ffe9b8" stroke-width="2" opacity="0.35"/>
