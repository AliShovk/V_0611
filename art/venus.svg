<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="planet" cx="0.38" cy="0.32" r="0.78">
      <stop offset="0" stop-color="#fff2c9"/>
      <stop offset="0.28" stop-color="#f6d98f"/>
      <stop offset="0.62" stop-color="#e0b163"/>
      <stop offset="0.86" stop-color="#b57f42"/>
      <stop offset="1" stop-color="#4a3118"/>
    </radialGradient>
    <radialGradient id="limb" cx="0.5" cy="0.5" r="0.5">
