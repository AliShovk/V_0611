    <g filter="url(#soft2)" opacity="0.55">
      <path d="M20 170 C 120 208, 260 190, 380 214 C 480 234, 560 224, 620 240 L620 262 C 540 250, 470 258, 380 238 C 260 212, 130 228, 20 196 Z"
