    </g>
  </g>

  <!-- гидроцилиндры (домкраты) -->
  <g>
    <g>
      <rect x="566" y="86" width="86" height="26" rx="8" fill="#39434f" stroke="#93a0b4" stroke-width="2"/>
      <rect x="648" y="93" width="52" height="12" rx="6" fill="#ccd7e6" stroke="#6d7b8f"/>
    </g>
    <g>
      <rect x="566" y="138" width="86" height="26" rx="8" fill="#39434f" stroke="#93a0b4" stroke-width="2"/>
      <rect x="648" y="145" width="52" height="12" rx="6" fill="#ccd7e6" stroke="#6d7b8f"/>
    </g>
    <g>
      <rect x="566" y="190" width="86" height="26" rx="8" fill="#39434f" stroke="#93a0b4" stroke-width="2"/>
      <rect x="648" y="197" width="52" height="12" rx="6" fill="#ccd7e6" stroke="#6d7b8f"/>
    </g>
    <g>
      <rect x="566" y="242" width="86" height="26" rx="8" fill="#39434f" stroke="#93a0b4" stroke-width="2"/>
      <rect x="648" y="249" width="52" height="12" rx="6" fill="#ccd7e6" stroke="#6d7b8f"/>
    </g>
  </g>

  <!-- обделка: верхний и нижний блоки кольца -->
  <g>
    <rect x="700" y="18" width="34" height="58" rx="6" fill="#9a958c" stroke="#5f5b54" stroke-width="2"/>
    <rect x="700" y="224" width="34" height="58" rx="6" fill="#9a958c" stroke="#5f5b54" stroke-width="2"/>
    <g stroke="#6f6a62" stroke-width="2">
      <path d="M734 30 L 760 30"/><path d="M734 60 L 760 60"/>
      <path d="M734 232 L 760 232"/><path d="M734 262 L 760 262"/>
    </g>
  </g>

  <!-- хвостовая рама -->
  <g>
    <rect x="762" y="60" width="16" height="200" fill="url(#srib)" stroke="#1a2230"/>
    <rect x="880" y="60" width="16" height="200" fill="url(#srib)" stroke="#1a2230"/>
    <rect x="1000" y="60" width="16" height="200" fill="url(#srib)" stroke="#1a2230"/>
    <rect x="762" y="60" width="254" height="14" rx="4" fill="url(#srib)" stroke="#1a2230"/>
    <!-- трубы и кабели -->
    <path d="M762 110 C 830 102, 900 118, 1016 110" stroke="#8b98ac" stroke-width="6" fill="none"/>
    <path d="M762 130 C 830 124, 900 138, 1016 130" stroke="#c98a4a" stroke-width="5" fill="none"/>
    <path d="M762 150 C 830 144, 900 158, 1016 150" stroke="#5f7fa0" stroke-width="4" fill="none"/>
    <!-- ролики -->
    <g fill="#4b5666" stroke="#8fa0b8" stroke-width="2">
      <circle cx="790" cy="262" r="9"/><circle cx="940" cy="262" r="9"/><circle cx="1010" cy="262" r="9"/>
