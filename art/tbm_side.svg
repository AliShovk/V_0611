    <!-- окно оператора -->
    <rect x="520" y="70" width="40" height="52" rx="8" fill="#8fd0e8" opacity="0.85" stroke="#1a2230" stroke-width="2"/>
    <!-- прожекторы -->
    <g>
      <rect x="176" y="8" width="52" height="14" rx="6" fill="#39434f" stroke="#8b98ac"/>
      <circle cx="190" cy="15" r="5" fill="#ffea9e"/>
      <circle cx="212" cy="15" r="5" fill="#ffea9e"/>
      <rect x="300" y="8" width="52" height="14" rx="6" fill="#39434f" stroke="#8b98ac"/>
      <circle cx="314" cy="15" r="5" fill="#ffea9e"/>
      <circle cx="336" cy="15" r="5" fill="#ffea9e"/>
