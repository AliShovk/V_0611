<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320">
  <defs>
    <linearGradient id="sbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa7bc"/>
      <stop offset="0.18" stop-color="#6b798f"/>
      <stop offset="0.55" stop-color="#455266"/>
      <stop offset="1" stop-color="#222a38"/>
    </linearGradient>
    <linearGradient id="srib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3cede"/>
      <stop offset="0.6" stop-color="#7b8a9f"/>
      <stop offset="1" stop-color="#39434f"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d3dcea"/>
      <stop offset="0.5" stop-color="#8d99ab"/>
      <stop offset="1" stop-color="#4a5566"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3846"/>
      <stop offset="1" stop-color="#161c26"/>
    </linearGradient>
    <filter id="sb" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- тень -->
  <ellipse cx="560" cy="292" rx="470" ry="16" fill="#000" opacity="0.35" filter="url(#sb)"/>

  <!-- ротор (вид сбоку): вертикальный диск -->
  <g>
    <rect x="30" y="18" width="46" height="264" rx="14" fill="url(#disc)" stroke="#121821" stroke-width="3"/>
    <!-- резцы по кромке -->
    <g fill="#dbe4f2" stroke="#3a4452" stroke-width="2">
      <circle cx="52" cy="30" r="8"/><circle cx="52" cy="58" r="8"/><circle cx="52" cy="86" r="8"/>
      <circle cx="52" cy="114" r="8"/><circle cx="52" cy="142" r="8"/><circle cx="52" cy="170" r="8"/>
      <circle cx="52" cy="198" r="8"/><circle cx="52" cy="226" r="8"/><circle cx="52" cy="254" r="8"/>
      <circle cx="52" cy="282" r="8"/>
    </g>
    <!-- спицы ротора, уходящие вглубь -->
    <g stroke="#7f8b9d" stroke-width="7" opacity="0.85">
      <path d="M76 40 L 138 40"/>
      <path d="M76 108 L 138 108"/>
      <path d="M76 176 L 138 176"/>
      <path d="M76 244 L 138 244"/>
    </g>
  </g>

  <!-- корпус щита -->
  <g>
    <rect x="140" y="26" width="430" height="248" rx="20" fill="url(#sbody)" stroke="#131922" stroke-width="3"/>
    <rect x="148" y="34" width="414" height="14" rx="7" fill="#c9d4e4" opacity="0.32"/>
    <g fill="url(#srib)" stroke="#1a2230" stroke-width="2">
      <rect x="196" y="30" width="14" height="240" rx="3"/>
      <rect x="268" y="30" width="14" height="240" rx="3"/>
      <rect x="340" y="30" width="14" height="240" rx="3"/>
      <rect x="412" y="30" width="14" height="240" rx="3"/>
      <rect x="484" y="30" width="14" height="240" rx="3"/>
    </g>
    <g fill="#95a2b6" stroke="#1a2230">
      <circle cx="203" cy="48" r="4"/><circle cx="275" cy="48" r="4"/><circle cx="347" cy="48" r="4"/>
      <circle cx="419" cy="48" r="4"/><circle cx="491" cy="48" r="4"/>
      <circle cx="203" cy="250" r="4"/><circle cx="275" cy="250" r="4"/><circle cx="347" cy="250" r="4"/>
      <circle cx="419" cy="250" r="4"/><circle cx="491" cy="250" r="4"/>
